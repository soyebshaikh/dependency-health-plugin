    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 0; overflow: hidden; }
        #legend { position: absolute; top: 10px; left: 10px; background: rgba(30,30,30,0.8); padding: 15px; border-radius: 8px; border: 1px solid #333; z-index: 10; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 14px; }
        .color-box { width: 16px; height: 16px; margin-right: 10px; border-radius: 3px; }
        .tooltip { position: absolute; background: #fff; color: #000; padding: 10px; border-radius: 4px; pointer-events: none; font-size: 13px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 1000; }
        
        svg { width: 100vw; height: 100vh; }
        .link { fill: none; stroke-opacity: 0.6; }
        
        .node circle.SAFE { fill: #4CAF50; }
        .node circle.DUPLICATE { fill: #8b5cf6; }
        .node circle.LOW { fill: #2196F3; }
        .node circle.MEDIUM { fill: #FFEB3B; }
        .node circle.HIGH { fill: #FF9800; }
        .node circle.CRITICAL { fill: #F44336; }
        
        .color-box.SAFE { background-color: #4CAF50; }
        .color-box.DUPLICATE { background-color: #8b5cf6; }
        .color-box.LOW { background-color: #2196F3; }
        .color-box.MEDIUM { background-color: #FFEB3B; }
        .color-box.HIGH { background-color: #FF9800; }
        .color-box.CRITICAL { background-color: #F44336; }
        
        .blast-radius { stroke: #F44336 !important; stroke-width: 3px !important; stroke-opacity: 0.8 !important; }
        
        .node text { pointer-events: none; font-size: 10px; fill: #eee; text-anchor: middle; }
        
        /* Duplicate Highlighting */
        .highlight-duplicate { stroke: #a78bfa !important; stroke-width: 4px !important; stroke-dasharray: 4; animation: pulse-violet 2s infinite; }
        @keyframes pulse-violet { 0% { fill: #8b5cf6; } 50% { fill: #a78bfa; } 100% { fill: #8b5cf6; } }
        
        #tools-panel { position: absolute; top: 10px; right: 10px; background: rgba(30,30,30,0.8); padding: 15px; border-radius: 8px; border: 1px solid #333; width: 250px; z-index: 10; }
        .btn { background: #8b5cf6; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; transition: background 0.2s; font-weight: 600; }
        .btn:hover { background: #7c3aed; }
        #duplicates-list { margin-top: 15px; max-height: 400px; overflow-y: auto; display: none; }
        .dup-item { padding: 10px; border-bottom: 1px solid #444; font-size: 13px; cursor: pointer; transition: background 0.2s; }
        .dup-item:hover { background: rgba(139, 92, 246, 0.2); }
        .dup-name { font-weight: bold; color: #a78bfa; margin-bottom: 4px; }
        .dimmed { opacity: 0.15 !important; }
    </style>
</head>

        const width = window.innerWidth;
        const height = window.innerHeight;
        let isHighlighting = false;

        const svg = d3.select("svg")
            .call(d3.zoom().on("zoom", function(event) {
                container.attr("transform", event.transform);
            }))
            .append("g");
            
        const container = svg.append("g");

        // SVG Markers for arrows
        svg.append("defs").selectAll("marker")
            .data(["normal", "blast"])
            .enter().append("marker")
            .attr("id", d => d)
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 15)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", d => d === 'blast' ? '#F44336' : '#999');

        const simulation = d3.forceSimulation(rawData.nodes)
            .force("link", d3.forceLink(rawData.links).id(d => d.id).distance(80))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collide", d3.forceCollide().radius(20));

        const link = container.append("g")
            .selectAll("path")
            .data(rawData.links)
            .join("path")
            .attr("class", d => `link ${d.type === 'blast_radius' ? 'blast-radius' : ''}`)
            .attr("stroke", d => d.type === 'blast_radius' ? '#F44336' : '#999')
            .attr("stroke-width", d => d.type === 'blast_radius' ? 3 : 1)
            .attr("marker-end", d => d.type === 'blast_radius' ? 'url(#blast)' : 'url(#normal)');

        const node = container.append("g")
            .selectAll("g")
            .data(rawData.nodes)
            .join("g")
            .attr("class", "node")
            .call(drag(simulation));

        node.append("circle")
            .attr("r", d => d.isDirect ? 12 : 8)
            .attr("class", d => d.risk)
            .attr("stroke", "#fff")
            .attr("stroke-width", 1.5)
            .on("mouseover", showTooltip)
            .on("mouseout", hideTooltip);

        node.append("text")
            .attr("dy", -15)
            .text(d => d.name);

        simulation.on("tick", () => {
            link.attr("d", d => {
                return `M${d.source.x},${d.source.y}L${d.target.x},${d.target.y}`;
            });

            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        // Tooltip logic
        const tooltip = d3.select("#tooltip");
        function showTooltip(event, d) {
            let metaHtml = "";
            if (d.metadata) {
                if (d.metadata.isEol) metaHtml += "<br><b>EOL:</b> Yes";
                if (d.metadata.vulnerabilitiesCount > 0) metaHtml += `<br><b>CVEs:</b> ${d.metadata.vulnerabilitiesCount}`;
                if (d.metadata.notes) metaHtml += `<br><b>Notes:</b> ${d.metadata.notes}`;
            }
            
            tooltip.style("display", "block")
                   .html(`<b>${d.id}</b><br>Risk: <span style="font-weight:bold" class="${d.risk}">${d.risk}</span>${metaHtml}`)
                   .style("left", (event.pageX + 15) + "px")
                   .style("top", (event.pageY - 10) + "px");
                   
            d3.select(this).attr("stroke", "#000").attr("stroke-width", 2);
        }
        
        function hideTooltip() {
            tooltip.style("display", "none");
            d3.select(this).attr("stroke", "#fff").attr("stroke-width", 1.5);
        }

        // Duplicate Detection Logic
        function findDuplicates() {
            const groups = {};
            rawData.nodes.forEach(n => {
                if (n.metadata && n.metadata.groupId) {
                    const key = `${n.metadata.groupId}:${n.metadata.artifactId}`;
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(n);
                }
            });

            const duplicateGroups = Object.keys(groups).filter(key => groups[key].length > 1);
            const duplicateNodeIds = new Set();
            duplicateGroups.forEach(key => groups[key].forEach(n => duplicateNodeIds.add(n.id)));
            
            const listEl = document.getElementById('duplicates-list');
            listEl.innerHTML = '';
            
            if (duplicateGroups.length === 0) {
                listEl.style.display = 'block';
                listEl.innerHTML = '<div style="color:#999;font-size:12px;margin-top:10px">No duplicate versions found.</div>';
                return;
            }
            
            listEl.style.display = 'block';
            listEl.innerHTML = '<div style="font-size:12px;margin-bottom:10px;color:#999">Conflicts Found:</div>';
            
            duplicateGroups.forEach(key => {
                const item = document.createElement('div');
                item.className = 'dup-item';
                const versions = groups[key].map(n => n.version).join(', ');
                item.innerHTML = `<div class="dup-name">${key.split(':')[1]}</div><div style="font-size:11px;color:#999">Versions: ${versions}</div>`;
                item.onclick = () => focusOnNode(groups[key][0].id);
                listEl.appendChild(item);
            });

            // Highlight in graph
            node.selectAll('circle')
                .classed('highlight-duplicate', d => duplicateNodeIds.has(d.id))
                .classed('dimmed', d => !duplicateNodeIds.has(d.id));
            
            link.classed('dimmed', true);
        }

        function focusOnNode(nodeId) {
            const targetNode = rawData.nodes.find(n => n.id === nodeId);
            if (targetNode) {
                const transform = d3.zoomIdentity
                    .translate(width / 2, height / 2)
                    .scale(1.5)
                    .translate(-targetNode.x, -targetNode.y);
                
                svg.transition().duration(750).call(d3.zoom().transform, transform);
            }
        }

        // Drag functions
        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }
            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }
            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }
            return d3.drag()
                     .on("start", dragstarted)
                     .on("drag", dragged)
                     .on("end", dragended);
        }
